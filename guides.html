<!DOCTYPE html>
<html lang="da">
<head>

<title>IT Guider – Sørensen IT & Reparation</title>

<style>
/* ══════════════════════════════════════════
   VARIABLER & RESET
══════════════════════════════════════════ */
:root {
  --accent:      #1d4ed8;
  --accent-dark: #1e40af;
  --bg:          #f6f9ff;
  --card:        #ffffff;
  --text:        #0f172a;
  --muted:       #475569;
  --success:     #10b981;
  --border:      #dbeafe;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding-top: 72px;
  -webkit-font-smoothing: antialiased;
}

/* ══════════════════════════════════════════
   NAV
══════════════════════════════════════════ */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 24px;
  padding: 16px 20px;
  background: white;
  border-bottom: 1px solid #e5e7eb;
  z-index: 200;
  flex-wrap: wrap;
}

nav a {
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--text);
  transition: color 0.2s;
}

nav a:hover, nav a.active { color: var(--accent); }

/* ══════════════════════════════════════════
   PAGE HERO
══════════════════════════════════════════ */
.page-hero {
  background: radial-gradient(circle at 30% 50%, #dbeafe, var(--bg) 70%);
  padding: 60px 20px 50px;
  text-align: center;
}

.page-hero h1 {
  font-size: clamp(2rem, 6vw, 3.2rem);
  font-weight: 900;
  letter-spacing: -0.5px;
  margin-bottom: 14px;
}

.page-hero h1 span { color: var(--accent); }

.page-hero p {
  font-size: 1.05rem;
  color: var(--muted);
  max-width: 520px;
  margin: 0 auto 32px;
}

/* ── Search bar ── */
.search-wrap {
  max-width: 440px;
  margin: 0 auto;
  position: relative;
}

.search-wrap input {
  width: 100%;
  padding: 14px 20px 14px 48px;
  border-radius: 999px;
  border: 2px solid var(--border);
  font-family: 'Outfit', sans-serif;
  font-size: 0.95rem;
  background: white;
  color: var(--text);
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}

.search-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(29,78,216,.12);
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.1rem;
  pointer-events: none;
}

/* ══════════════════════════════════════════
   FILTER TABS
══════════════════════════════════════════ */
.filters-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 30px 20px 0;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 8px 18px;
  border-radius: 999px;
  border: 2px solid var(--border);
  background: white;
  font-family: 'Outfit', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: 0.2s;
  white-space: nowrap;
}

.filter-btn:hover { border-color: var(--accent); color: var(--accent); }

.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* ══════════════════════════════════════════
   GUIDES GRID
══════════════════════════════════════════ */
.guides-section {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

.result-count {
  font-size: 0.82rem;
  color: var(--muted);
  margin-bottom: 20px;
  font-weight: 500;
}

.guides-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

/* ── Guide card ── */
.guide-card {
  background: white;
  border-radius: 18px;
  border: 1px solid var(--border);
  box-shadow: 0 4px 16px rgba(29,78,216,.07);

  flex-direction: column;
  overflow: hidden;

}

.guide-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(29,78,216,.14);
}

.guide-card:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

.card-top {
  padding: 26px 24px 20px;
  flex: 1;
}

.card-emoji {
  font-size: 2.4rem;

  margin-bottom: 14px;

}

.card-category {

}

.cat-hardware  { background: #dbeafe; color: #1e40af; }
.cat-software  { background: #d1fae5; color: #065f46; }
.cat-gaming    { background: #ede9fe; color: #5b21b6; }
.cat-vedligehold { background: #fef3c7; color: #92400e; }

.card-title {
  font-size: 1.1rem;

  line-height: 1.3;
}

.card-subtitle {
  font-size: 0.87rem;

}

.card-bottom {
  padding: 16px 24px;
  border-top: 1px solid #f1f5f9;

  align-items: center;
}

.card-meta {
  font-size: 0.78rem;
  color: var(--muted);
  font-weight: 500;

  gap: 12px;
}

.card-meta span { display: flex; align-items: center; gap: 4px; }

.btn-read {

  font-size: 0.82rem;
  font-weight: 700;
  color: var(--accent);

}

.btn-read:hover {
  background: var(--accent);

  border-color: var(--accent);
}

/* No results */
.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}

.no-results p { margin-top: 8px; font-size: 0.9rem; }

/* ══════════════════════════════════════════
   ARTICLE READER (fullscreen overlay)
══════════════════════════════════════════ */
.reader-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 9999;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(.4,0,.2,1);
}

.reader-overlay.open {
  transform: translateX(0);
}

/* Reading progress bar */
.read-progress {
  position: fixed;
  top: 0; left: 0;
  height: 4px;
  background: var(--accent);
  z-index: 10000;
  transition: width 0.1s linear;
  width: 0%;
}

/* Reader top bar */
.reader-topbar {
  position: sticky;
  top: 0;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
}

.btn-back {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Outfit', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px 0;
  transition: gap 0.2s;
}

.btn-back:hover { gap: 10px; }

.reader-topbar-title {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--muted);
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Reader article */
.reader-article {
  max-width: 700px;
  margin: 0 auto;
  padding: 48px 24px 100px;
}

/* Article header */
.article-kicker {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  margin-bottom: 12px;
}

.article-title {
  font-size: clamp(1.8rem, 5vw, 2.6rem);
  font-weight: 900;
  letter-spacing: -0.5px;
  line-height: 1.2;
  margin-bottom: 16px;
}

.article-meta {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 36px;
  padding-bottom: 28px;
  border-bottom: 2px solid var(--border);
  font-size: 0.82rem;
  color: var(--muted);
  font-weight: 500;
}

.article-meta span { display: flex; align-items: center; gap: 5px; }

/* ── Article body typography ── */
.article-body { line-height: 1.8; }

.article-body p {
  font-size: 1.02rem;
  color: var(--text);
  margin-bottom: 20px;
}

.article-body .lead {
  font-size: 1.12rem;
  color: var(--muted);
  font-weight: 400;
  line-height: 1.7;
  margin-bottom: 28px;
}

.article-body h2 {
  font-size: 1.45rem;
  font-weight: 800;
  color: var(--text);
  margin: 40px 0 16px;
  letter-spacing: -0.2px;
}

.article-body h3 {
  font-size: 1.12rem;
  font-weight: 700;
  color: var(--text);
  margin: 28px 0 10px;
}

/* Numbered step list */
.article-body ol.steps {
  list-style: none;
  counter-reset: step-counter;
  margin: 24px 0;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.article-body ol.steps li {
  counter-increment: step-counter;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

.article-body ol.steps li::before {
  content: counter(step-counter);
  background: var(--accent);
  color: white;
  min-width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 0.82rem;
  flex-shrink: 0;
  margin-top: 3px;
}

.article-body ol.steps li .step-body { flex: 1; }
.article-body ol.steps li .step-title { font-weight: 700; margin-bottom: 4px; }
.article-body ol.steps li .step-desc  { font-size: 0.9rem; color: var(--muted); line-height: 1.6; }

/* Plain bullet list */
.article-body ul.bullets {
  list-style: none;
  margin: 16px 0 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.article-body ul.bullets li {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 0.97rem;
  line-height: 1.6;
}

.article-body ul.bullets li::before {
  content: '→';
  color: var(--accent);
  font-weight: 800;
  flex-shrink: 0;
  margin-top: 2px;
}

/* Callout boxes */
.tip-box, .warning-box, .info-box {
  border-radius: 0 14px 14px 0;
  padding: 16px 20px;
  margin: 24px 0;
  font-size: 0.92rem;
  line-height: 1.6;
}

.tip-box {
  background: #eff6ff;
  border-left: 4px solid var(--accent);
  color: #1e40af;
}

.tip-box strong { color: var(--accent-dark); }

.warning-box {
  background: #fef3c7;
  border-left: 4px solid #f59e0b;
  color: #92400e;
}

.info-box {
  background: #f0fdf4;
  border-left: 4px solid var(--success);
  color: #065f46;
}

/* Comparison table */
.compare-table {
  width: 100%;
  border-collapse: collapse;
  margin: 24px 0;
  font-size: 0.9rem;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.compare-table th {
  background: var(--accent);
  color: white;
  padding: 12px 16px;
  text-align: left;
  font-weight: 700;
  font-size: 0.82rem;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.compare-table td {
  padding: 11px 16px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: top;
  line-height: 1.5;
}

.compare-table tr:last-child td { border-bottom: none; }
.compare-table tr:nth-child(even) td { background: #f8fafc; }

/* CTA box at end of article */
.article-cta {
  background: linear-gradient(135deg, #eff6ff, #e0f2fe);
  border: 2px solid var(--border);
  border-radius: 18px;
  padding: 28px;
  margin-top: 48px;
  text-align: center;
}

.article-cta h3 {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 8px;
}

.article-cta p {
  color: var(--muted);
  font-size: 0.9rem;
  margin-bottom: 20px;
}

.article-cta .cta-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

.cta-btn-primary {
  background: var(--accent);
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 999px;
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 0.2s;
}

.cta-btn-primary:hover { background: var(--accent-dark); }

.cta-btn-secondary {
  background: white;
  color: var(--accent);
  border: 2px solid var(--accent);
  padding: 12px 24px;
  border-radius: 999px;
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: 0.2s;
}

.cta-btn-secondary:hover { background: var(--accent); color: white; }

/* ══════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════ */
@media (max-width: 640px) {
  .page-hero { padding: 40px 16px 36px; }

  nav { gap: 14px; padding: 12px 16px; }
  .compare-table { font-size: 0.8rem; }
  .compare-table td, .compare-table th { padding: 9px 12px; }
  .article-cta .cta-buttons { flex-direction: column; align-items: center; }
}
</style>

<script>
/* ─── CTA SNIPPET (reused in every article) ───────────────── */
const CTA = `
<div class="article-cta">
  <h3>🛠️ Har du stadig problemer?</h3>
  <p>Jonas & Storm hjælper dig. Send din PC ind, og vi kigger på den inden 2-3 hverdage.</p>
  <div class="cta-buttons">
    <a href="service-indlevering.html" class="cta-btn-primary">📦 Send din PC ind</a>
    <a href="tel:93869267" class="cta-btn-secondary">📞 Ring: 93 86 92 67</a>
  </div>
</div>`;

/* ─── GUIDES DATA ─────────────────────────────────────────── */
const guides = [

  /* ══ 1 ══════════════════════════════════════════════════════ */
  {
    id: 1,
    category: 'hardware',
    categoryLabel: 'Hardware',
    emoji: '🔧',
    title: 'Min PC starter ikke',
    subtitle: 'Trin-for-trin fejlfinding inden du giver op',
    readTime: '6 min',
    difficulty: 'Let',
    content: `
      <p class="lead">Din PC gider ikke starte — det er frustrerende. Men inden du sender den til os, er der en række enkle ting du selv kan tjekke. De fleste "PC starter ikke"-problemer har en simpel forklaring.</p>

      <h2>Tjek det basale først</h2>
      <p>Det lyder banalt, men over halvdelen af alle sager skyldes løse kabler eller et stik der er røget ud. Start her:</p>
      <ol class="steps">
        <li>
          <div class="step-body">
            <div class="step-title">Tjek strømkablet</div>
            <div class="step-desc">Sørg for at strømkablet sidder solidt i både stikkontakten og bag på PC'en (eller i UPS'en). Prøv eventuelt en anden kontakt i væggen.</div>
          </div>
        </li>
        <li>
          <div class="step-body">
            <div class="step-title">Er skærmen tændt og forbundet?</div>
            <div class="step-desc">Skærmen skal have strøm OG være forbundet til PC'en med HDMI, DisplayPort eller lignende. Tjek at kablet sidder fast i begge ender. Prøv en anden indgang på skærmen ved at trykke "Input" eller "Source" på skærmens knapper.</div>
          </div>
        </li>
        <li>
          <div class="step-body">
            <div class="step-title">Hold powerknappen inde i 10 sekunder</div>
            <div class="step-desc">Nogle gange er PC'en "låst" i en dvaletilstand. Hold powerknappen inde i 10 sekunder for at tvinge den til at slukke, og tryk den derefter kortvarigt igen for at starte den.</div>
          </div>
        </li>
        <li>
          <div class="step-body">
            <div class="step-title">Tag stikket helt ud — vent 30 sekunder</div>
            <div class="step-desc">Tag strømkablet ud af PC'en, vent 30 sekunder og sæt det i igen. Dette tømmer kondensatorer og nulstiller strømforsyningen. En overraskende effektiv løsning.</div>
          </div>
        </li>
      </ol>

      <h2>Hvad siger PC'en?</h2>
      <p>Lyt efter lyde og kig efter LED-lys, når du forsøger at starte. De fortæller meget:</p>
      <ul class="bullets">
        <li><strong>Ingen lyde, ingen lys:</strong> Problemet er sandsynligvis strømforsyningen (PSU) eller stikket. Tjek strøm igen.</li>
        <li><strong>Ventilatorer kører, men ingen billede:</strong> Sandsynligvis en defekt GPU, løs RAM-stav eller bundkortproblem.</li>
        <li><strong>Et langt bip + to korte bip:</strong> RAM-fejl. Se trin herunder.</li>
        <li><strong>Tre korte bip:</strong> RAM-fejl eller bundkortfejl.</li>
        <li><strong>Gentagne korte bip:</strong> CPU-fejl eller overophedning.</li>
      </ul>

      <div class="tip-box">💡 <strong>Tip:</strong> Bip-koderne varierer fra bundkort til bundkort. Søg på Google efter dit bundkorts mærke + "beep codes" for en præcis oversigt.</div>

      <h2>Prøv at fjerne RAM-stavene</h2>
      <p>RAM er den hyppigste synder bag "starter ikke"-problemer. Sådan tester du:</p>
      <ol class="steps">
        <li>
          <div class="step-body">
            <div class="step-title">Sluk PC'en og tag stikket ud</div>
            <div class="step-desc">Sikkerhed først — aldrig rod med indmaden mens der er strøm på.</div>
          </div>
        </li>
        <li>
          <div class="step-body">
            <div class="step-title">Find RAM-stavene</div>

      <p>Graphics Processing Unit. Dedikeret til at beregne og vise billeder på din skærm. I gaming er GPU'en oftest den vigtigste komponent — den bestemmer FPS og grafikdetaljer. GPU'en har sit eget RAM kaldet VRAM.</p>
      <p>NVIDIA (GeForce-serien) og AMD (Radeon-serien) dominerer markedet.</p>

      <div class="tip-box">💡 Har din PC ikke et dedikeret grafikkort? Mange CPU'er har integreret grafik, der kan køre Windows fint og lette videoafspilning — men ikke gaming i nogen særlig grad.</div>

      <h2>RAM — arbejdshukommelsen</h2>
      <p>Det midlertidige sted alt kører mens PC'en er tændt. Se vores separate guide om RAM for detaljer.</p>

      <h2>SSD og HDD — lagring</h2>
      <table class="compare-table">

/* ─── STATE ─────────────────────────────────────────────── */
let activeFilter  = 'all';
let searchQuery   = '';

/* ─── RENDER CARDS ──────────────────────────────────────── */
function renderGrid() {
  const grid  = document.getElementById('guidesGrid');
  const count = document.getElementById('resultCount');

  const filtered = guides.filter(g => {
    const matchCat    = activeFilter === 'all' || g.category === activeFilter;
    const q           = searchQuery.toLowerCase();
    const matchSearch = !q || g.title.toLowerCase().includes(q)
                            || g.subtitle.toLowerCase().includes(q)
                            || g.category.toLowerCase().includes(q)
                            || g.categoryLabel.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });

  count.textContent = filtered.length === guides.length
    ? `${guides.length} guider`
    : `${filtered.length} af ${guides.length} guider`;

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="no-results">
        <div style="font-size:2.5rem;">🔎</div>
        <p>Ingen guider matcher din søgning.</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(g => `
    <div class="guide-card" tabindex="0"
         onclick="openGuide(${g.id})"
         onkeydown="if(event.key==='Enter')openGuide(${g.id})">
      <div class="card-top">
        <span class="card-emoji">${g.emoji}</span>
        <span class="card-category cat-${g.category}">${g.categoryLabel}</span>
        <h2 class="card-title">${g.title}</h2>
        <p class="card-subtitle">${g.subtitle}</p>
      </div>
      <div class="card-bottom">
        <div class="card-meta">
          <span>⏱ ${g.readTime}</span>
          <span>📊 ${g.difficulty}</span>
        </div>
        <button class="btn-read" onclick="event.stopPropagation();openGuide(${g.id})">Læs →</button>
      </div>
    </div>
  `).join('');
}

/* ─── FILTER & SEARCH ───────────────────────────────────── */
function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function filterGuides() {
  searchQuery = document.getElementById('searchInput').value;
  renderGrid();
}

/* ─── OPEN GUIDE ────────────────────────────────────────── */
function openGuide(id) {
  const guide   = guides.find(g => g.id === id);
  if (!guide) return;

  const overlay = document.getElementById('readerOverlay');
  const content = document.getElementById('articleContent');

  content.innerHTML = `
    <p class="article-kicker">${guide.emoji} ${guide.categoryLabel}</p>
    <h1 class="article-title">${guide.title}</h1>
    <div class="article-meta">
      <span>⏱ ${guide.readTime} læsetid</span>
      <span>📊 ${guide.difficulty}</span>
    </div>
    <div class="article-body">${guide.content}</div>
  `;

  document.getElementById('readerTopbarTitle').textContent = guide.title;
  document.getElementById('readProgress').style.width = '0%';
  overlay.scrollTop = 0;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

/* ─── CLOSE READER ──────────────────────────────────────── */
function closeReader() {
  document.getElementById('readerOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ─── READING PROGRESS BAR ──────────────────────────────── */
document.getElementById('readerOverlay').addEventListener('scroll', function () {
  const el      = this;
  const scrolled = el.scrollTop;
  const total    = el.scrollHeight - el.clientHeight;
  const pct      = total > 0 ? (scrolled / total) * 100 : 0;
  document.getElementById('readProgress').style.width = pct + '%';
});

/* ─── ESC to close ──────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeReader();
});

/* ─── INIT ──────────────────────────────────────────────── */
renderGrid();
</script>
